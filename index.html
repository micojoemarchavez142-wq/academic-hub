<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Hub | Time Manager</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #bb86fc;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --success: #03dac6;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .timer-display {
            font-size: 3.5rem;
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            font-family: monospace;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: var(--text-color);
            font-size: 1rem;
        }

        input { flex: 1; }

        button {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        button:active { opacity: 0.8; }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .task-text {
            cursor: pointer;
            flex: 1;
        }

        .completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-btn {
            background: transparent;
            color: #ff5555;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 5px;
        }

        .schedule-time {
            color: var(--accent-color);
            font-size: 0.85rem;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ACADEMIC HUB</h1>
        <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">Master your time, crush your goals.</p>
    </header>

    <div class="dashboard-grid">
        <div class="card">
            <h2>⏱️ Focus Timer (Pomodoro)</h2>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button onclick="startTimer()" style="flex: 1;">Start</button>
                <button onclick="pauseTimer()" style="flex: 1; background-color: #666; color: #fff;">Pause</button>
                <button onclick="resetTimer()" style="flex: 1; background-color: transparent; border: 1px solid #666; color: #fff;">Reset</button>
            </div>
        </div>

        <div class="card">
            <h2>📝 Academics To-Do List</h2>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add task or assignment...">
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="taskList"></ul>
        </div>

        <div class="card">
            <h2>📅 Today's Subjects</h2>
            <ul id="scheduleList">
                <li><div><span class="schedule-time">08:30 AM - 10:00 AM</span><strong>Major Class 1</strong></div></li>
                <li><div><span class="schedule-time">01:00 PM - 02:30 PM</span><strong>GE Elective</strong></div></li>
                <li><div><span class="schedule-time">03:00 PM - 04:30 PM</span><strong>Laboratory Practice</strong></div></li>
            </ul>
        </div>
    </div>
</div>

<script>
    // --- JAVASCRIPT FOR TIMER ---
    let timer;
    let timeLeft = 25 * 60; // 25 minutes in seconds
    let isRunning = false;

    const timerDisplay = document.getElementById('timer');

    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerDisplay.textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        if (isRunning) return; // Prevent multiple intervals
        isRunning = true;
        timer = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timer);
                isRunning = false;
                alert("Time's up! Take a break.");
                resetTimer();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timer);
        isRunning = false;
    }

    function resetTimer() {
        clearInterval(timer);
        isRunning = false;
        timeLeft = 25 * 60;
        updateDisplay();
    }

    // --- JAVASCRIPT FOR TO-DO LIST ---
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    function addTask() {
        const taskText = taskInput.value.trim();
        if (taskText === '') return;

        const li = document.createElement('li');
        
        // Task text container
        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = taskText;
        // Toggle complete when clicked
        span.onclick = function() {
            span.classList.toggle('completed');
        };

        // Delete button
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.onclick = function() {
            taskList.removeChild(li);
        };

        li.appendChild(span);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);

        taskInput.value = ''; // Clear input field
    }

    // Allow pressing "Enter" key to add task
    taskInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addTask();
        }
    });
</script>

</body>
</html>
